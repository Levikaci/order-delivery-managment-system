name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore OrderDeliveryManagementSystem.sln
      - run: dotnet build OrderDeliveryManagementSystem.sln --no-restore -c Release -p:EnableWindowsTargeting=true
      - run: dotnet test OrderDeliveryManagementSystem.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
