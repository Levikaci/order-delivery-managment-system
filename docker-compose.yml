# Локальная разработка и учебный запуск: демо-данные, стандартный пароль БД, порты только на 127.0.0.1.
# Для сервера используйте docker-compose.prod.yml (см. README, раздел «Рабочее развёртывание»).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery}
    ports:
      # для запуска API и тестов вне Docker (dotnet run / dotnet test); снаружи машины база недоступна
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=delivery;Username=delivery;Password=${POSTGRES_PASSWORD:-delivery}"
      Seed__Demo: "${SEED_DEMO:-true}"
    restart: unless-stopped
volumes:
  pgdata:
